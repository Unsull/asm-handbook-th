groups:
  - name: shop_alerts
    rules:
      - alert: ShopAPIUnhealthy
        expr: shop_lab_api_healthy == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Synthetic shop API unavailable"
      - alert: ShopPaymentErrorsHigh
        expr: shop_lab_payment_error_ratio > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Synthetic payment error ratio over 5 percent"
      - alert: ShopMetricsTargetDown
        expr: up{job="mock_shop"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Metrics scraper cannot reach target"
